# Дополнения к официальному комплекту Supabase (/opt/supabase): сайт в Caddy,
# секреты наших функций, порты базы и Studio — только на localhost (Docker обходит ufw).
services:
  caddy:
    volumes:
      - /opt/site:/srv/site:ro

  functions:
    env_file: [./bani-functions.env]

  supavisor:
    ports: !reset
      - 127.0.0.1:${POSTGRES_PORT}:5432
      - 127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543

  studio:
    ports:
      - 127.0.0.1:3000:3000
